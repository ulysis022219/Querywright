name: Build VSIX

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core checks
        run: dotnet run --project tests/SqlWorkbench.Checks
      - name: Build VSIX
        run: dotnet build src/SqlWorkbench.Ssms/SqlWorkbench.Ssms.csproj
      - name: Verify package
        shell: powershell
        run: scripts/Test-Package.ps1
      - name: Assemble installer zip
        shell: powershell
        run: |
          $out = New-Item -ItemType Directory -Force dist/SqlWorkbench
          Copy-Item src/SqlWorkbench.Ssms/bin/Debug/net472/SqlWorkbench.Ssms.vsix $out
          Copy-Item scripts/Install-Development.ps1 (Join-Path $out 'Install-SqlWorkbench.ps1')
          Copy-Item scripts/Test-Package.ps1 $out
          Copy-Item examples/offline-schema.sql $out
          Copy-Item docs/INSTALL.txt $out
          Compress-Archive -Path "$out/*" -DestinationPath dist/SqlWorkbench-ssms22.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SqlWorkbench-ssms22
          path: dist/SqlWorkbench-ssms22.zip
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/SqlWorkbench-ssms22.zip --prerelease --target "$GITHUB_SHA" \
            --title "SqlWorkbench dev build ($GITHUB_REF_NAME)" \
            --notes "Untested development build from ${GITHUB_SHA}. See INSTALL.txt inside the zip."
