name: Build VSIX

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core checks
        run: dotnet run --project tests/Querywright.Checks
      - name: Build VSIX
        run: dotnet build src/Querywright.Ssms/Querywright.Ssms.csproj
      - name: Verify package
        shell: powershell
        run: scripts/Test-Package.ps1
      - name: Assemble installer zip
        shell: powershell
        run: |
          $out = New-Item -ItemType Directory -Force dist/Querywright
          Copy-Item src/Querywright.Ssms/bin/Debug/net472/Querywright.Ssms.vsix $out
          Copy-Item scripts/Install-Development.ps1 (Join-Path $out 'Install-Querywright.ps1')
          Copy-Item scripts/Test-Package.ps1 $out
          Copy-Item scripts/Install.cmd $out
          Copy-Item examples/offline-schema.sql $out
          Copy-Item docs/INSTALL.txt $out
          Compress-Archive -Path "$out/*" -DestinationPath dist/Querywright-ssms22.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Querywright-ssms22
          path: dist/Querywright-ssms22.zip
      - name: Publish prerelease
        if: github.ref_type == 'branch'
        # Needs Settings > Actions > Workflow permissions = read and write; the run artifact works either way.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/Querywright-ssms22.zip --prerelease --target "$GITHUB_SHA" \
            --title "Querywright dev build ($GITHUB_REF_NAME)" \
            --notes "Untested development build from ${GITHUB_SHA}. See INSTALL.txt inside the zip."

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Querywright-ssms22
      - name: SSMS 22 end-to-end
        shell: powershell
        run: |
          Expand-Archive Querywright-ssms22.zip -DestinationPath pkg
          scripts/Test-Ssms.ps1 -Package (Resolve-Path pkg/Querywright.Ssms.vsix)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: e2e

  release:
    # Pushing a v* tag publishes a release, only after the SSMS end-to-end tests pass.
    needs: [build, e2e]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Querywright-ssms22
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Querywright-ssms22.zip --repo "$GITHUB_REPOSITORY" \
            --title "Querywright $GITHUB_REF_NAME" --generate-notes \
            --notes "Unzip, then double-click Install.cmd (see INSTALL.txt). Development release; no affiliation with Redgate."
