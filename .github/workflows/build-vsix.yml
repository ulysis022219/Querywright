name: Build VSIX

on:
  push:
    branches: [main, master, dev, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish after the tests pass, e.g. v0.4.0 (empty: build only)'
        required: false
        default: ''
      notes:
        description: 'What changed, as Markdown (empty: list the commits since the previous release)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read # release runs look up the earlier green run of the same commit

# A newer push to the same branch makes the older run pointless; releases are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    # One job: SSMS 22 installs (about 5 minutes) while the checks and the build run, then the end-to-end test uses it.
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # dev prerelease
    steps:
      - name: Skip SSMS 22 if this commit already passed it
        # A release is dispatched on a commit whose push run already ran the end-to-end tests: don't repeat ~11 minutes.
        id: prior
        if: inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-vsix.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq length || echo 0)
          [ "${n:-0}" -gt 0 ] && echo "e2e=skip" >> "$GITHUB_OUTPUT" || true
      - name: Start SSMS 22 install
        if: steps.prior.outputs.e2e != 'skip'
        shell: powershell
        run: |
          $boot = Join-Path $env:RUNNER_TEMP 'vs_SSMS.exe'
          Invoke-WebRequest 'https://aka.ms/ssms/22/release/vs_SSMS.exe' -OutFile $boot
          Start-Process $boot -ArgumentList '--quiet', '--wait', '--norestart', '--nocache'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core checks
        run: dotnet run --project tests/Querywright.Checks
      - name: Stamp version
        # major.minor.patch from the release tag (else the manifest) plus the run number, so every build installs over the last.
        shell: powershell
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          $m = 'src/Querywright.Ssms/source.extension.vsixmanifest'
          $x = [IO.File]::ReadAllText($m)
          $base = if ($env:RELEASE) { $env:RELEASE.TrimStart('v') } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { [regex]::Match($x, '<Identity [^>]*Version="(\d+\.\d+\.\d+)').Groups[1].Value }
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$base'." }
          [IO.File]::WriteAllText($m, [regex]::Replace($x, '(<Identity [^>]*Version=")[^"]+', "`${1}$base.$env:GITHUB_RUN_NUMBER"))
          Write-Output "Version $base.$env:GITHUB_RUN_NUMBER"
      - name: Build VSIX
        run: dotnet build src/Querywright.Ssms/Querywright.Ssms.csproj
      - name: Dialog layout and interaction checks
        shell: powershell
        run: |
          foreach ($scale in 100, 125, 150, 200) { scripts/Test-Dialogs.ps1 -Scale $scale }
      - name: Verify package
        shell: powershell
        run: scripts/Test-Package.ps1
      - name: Assemble installer zip
        shell: powershell
        run: |
          $out = New-Item -ItemType Directory -Force dist/Querywright
          Copy-Item src/Querywright.Ssms/bin/Debug/net472/Querywright.Ssms.vsix $out
          Copy-Item scripts/Install-Development.ps1 (Join-Path $out 'Install-Querywright.ps1')
          Copy-Item scripts/Test-Package.ps1 $out
          Copy-Item scripts/Install.cmd $out
          Copy-Item scripts/Uninstall.cmd $out
          Copy-Item examples/offline-schema.sql $out
          Copy-Item docs/INSTALL.txt $out
          Compress-Archive -Path "$out/*" -DestinationPath dist/Querywright-ssms22.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Querywright-ssms22
          path: dist/Querywright-ssms22.zip
      - name: Publish prerelease
        if: github.ref_type == 'branch'
        # Needs Settings > Actions > Workflow permissions = read and write; the run artifact works either way.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/Querywright-ssms22.zip --prerelease --target "$GITHUB_SHA" \
            --title "Querywright dev build ($GITHUB_REF_NAME)" \
            --notes "Untested development build from ${GITHUB_SHA}. See INSTALL.txt inside the zip."
      - name: SSMS 22 end-to-end
        if: steps.prior.outputs.e2e != 'skip'
        shell: powershell
        run: |
          Get-Process vs_SSMS -ErrorAction SilentlyContinue | Wait-Process
          scripts/Test-Ssms.ps1 -Package (Resolve-Path src/Querywright.Ssms/bin/Debug/net472/Querywright.Ssms.vsix)
      - uses: actions/upload-artifact@v4
        if: always() && steps.prior.outputs.e2e != 'skip'
        with:
          name: e2e-evidence
          path: e2e

  release:
    # A v* tag push, or Run workflow with a release tag, publishes a release after the SSMS end-to-end tests pass.
    needs: build
    permissions:
      contents: write
    if: github.ref_type == 'tag' || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the commits since the previous release
      - uses: actions/download-artifact@v4
        with:
          name: Querywright-ssms22
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release tag must look like v1.2.3"; exit 1; }
          # ponytail: --generate-notes needs more than the job token (HTTP 403), so the list comes from git log.
          if [ -z "$NOTES" ]; then
            previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
            NOTES=$(git log --no-merges --format='- %s' ${previous:+"$previous.."}"$GITHUB_SHA")
          fi
          printf '## What changed\n\n%s\n\n## Install or update\n\nClose SSMS 22, unzip, double-click Install.cmd (see INSTALL.txt). To remove it, double-click Uninstall.cmd. Free and open source (MIT).\n' "$NOTES" > notes.md
          gh release create "$TAG" Querywright-ssms22.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Querywright $TAG" --notes-file notes.md
